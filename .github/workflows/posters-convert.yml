name: posters-convert

on:
  workflow_dispatch:
    inputs:
      boards:
        description: "Board URLs (one per line; empty = use posters-boards.txt)"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check out posters-assets branch
        run: |
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          git fetch origin posters-assets || true
          if git rev-parse --verify origin/posters-assets >/dev/null 2>&1; then
            git checkout posters-assets
          else
            git checkout --orphan posters-assets
            git rm -rf . || true
            printf '# Poster video assets (CI-managed, do not edit by hand)\n' > README.md
          fi
          mkdir -p assets/posters
          echo "WORKDIR=$PWD" >> "$GITHUB_ENV"

      - name: Convert missing board videos to VP9 webm
        env:
          BOARDS_INPUT: ${{ inputs.boards }}
        run: |
          cd "$WORKDIR"
          python3 - <<'EOF'
          import json, os, re, subprocess, urllib.parse, urllib.request

          UA = {"User-Agent": "Mozilla/5.0"}
          OUTDIR = os.path.join(os.environ["WORKDIR"], "assets", "posters")

          def get(url):
              req = urllib.request.Request(url, headers=UA)
              return urllib.request.urlopen(req, timeout=30)

          boards = [l.strip() for l in os.environ.get("BOARDS_INPUT", "").splitlines() if l.strip()]
          if not boards:
              repo = os.environ["REPO"]
              try:
                  txt = get("https://raw.githubusercontent.com/%s/master/posters-boards.txt" % repo).read().decode()
                  boards = [l.strip() for l in txt.splitlines() if l.strip()]
              except Exception as e:
                  print("no boards given and posters-boards.txt unreadable:", e)
          if not boards:
              print("nothing to do")
              raise SystemExit(0)

          def board_pins(user, slug):
              u = "https://widgets.pinterest.com/v3/pidgets/boards/%s/%s/pins/" % (
                  urllib.parse.quote(user), urllib.parse.quote(slug))
              return json.load(get(u))["data"]["pins"]

          def pins_info(ids):
              u = "https://widgets.pinterest.com/v3/pidgets/pins/info/?pin_ids=" + ",".join(
                  urllib.parse.quote(i) for i in ids)
              d = json.load(get(u))["data"]
              return d if isinstance(d, list) else d.get("pins", [])

          def video_url(pin):
              for pg in ((pin.get("story_pin_data") or {}).get("pages") or []):
                  vl = ((pg.get("video") or {}).get("video_list") or {})
                  for v in vl.values():
                      if re.search(r"\.mp4($|[?#])", v.get("url") or "", re.I):
                          return v["url"]
                  for v in vl.values():
                      if re.search(r"\.m3u8($|[?#])", v.get("url") or "", re.I):
                          return v["url"]
              return None

          done, skipped, failed = 0, 0, []
          for b in boards:
              m = re.search(r"pinterest\.[a-z.]+/([^/?#]+)/([^/?#]+)", b, re.I)
              if not m:
                  print("skip (not a board URL):", b, flush=True)
                  continue
              pins = board_pins(m.group(1), m.group(2))
              print("board %s/%s: %d pin(s)" % (m.group(1), m.group(2), len(pins)), flush=True)
              cands = [str(p["id"]) for p in pins
                       if p.get("id") is not None and (p.get("is_video") or (p.get("story_pin_data") or {}).get("id"))]
              for i in range(0, len(cands), 50):
                  for pin in pins_info(cands[i:i + 50]):
                      pid = str(pin.get("id"))
                      dest = os.path.join(OUTDIR, "spotui-%s.webm" % pid)
                      if os.path.exists(dest):
                          skipped += 1
                          continue
                      src = video_url(pin)
                      if not src:
                          continue
                      print("converting pin", pid, flush=True)
                      r = subprocess.run(["ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
                                          "-i", src, "-c:v", "libvpx-vp9", "-b:v", "0", "-crf", "30",
                                          "-row-mt", "1", "-an", dest])
                      if r.returncode == 0:
                          done += 1
                      else:
                          failed.append(pid)
          print("converted: %d, cached: %d, failed: %s" % (done, skipped, failed))
          EOF

      - name: Commit and push new clips
        run: |
          cd "$WORKDIR"
          git add assets/posters
          git -c user.name="spotui-ci" -c user.email="spotui-ci@local" \
            commit -m "posters assets update" || { echo "nothing new"; exit 0; }
          git push -u origin posters-assets
